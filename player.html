<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=320, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  #host {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
  }
  #yt-iframe {
    width: 100%;
    height: 100%;
    border: 0;
  }
</style>
</head>
<body>
<div id="host"></div>
<script>
(function () {
  function getQueryParam(name) {
    var match = RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
    return match && decodeURIComponent(match[1].replace(/\+/g, ' '));
  }

  var paramOrigin = getQueryParam('origin');
  var ORIGIN = (paramOrigin && paramOrigin.length > 0) ? paramOrigin : '__ORIGIN__';

  var paramMode = getQueryParam('mode');
  var MODE = (paramMode && paramMode.length > 0) ? paramMode : '__MODE__';
  if (MODE !== 'B') {
    MODE = 'A';
  }

  var player = null;
  var pending = null;
  var modeB_iframe = null;
  var modeB_state = -1;
  var modeB_currentTime = 0;
  var modeB_duration = 0;

  function send(type, data) {
    try {
      var f = document.createElement('iframe');
      f.style.display = 'none';
      f.src = 'sl://' + type + '?d=' + encodeURIComponent(JSON.stringify(data || {}));
      document.body.appendChild(f);
      setTimeout(function () {
        if (f.parentNode) {
          f.parentNode.removeChild(f);
        }
      }, 0);
    } catch (e) {
      // ignore
    }
  }

  function log(msg) {
    send('log', { m: msg });
  }

  function postToIframe(func, args) {
    if (modeB_iframe && modeB_iframe.contentWindow) {
      try {
        var msg = JSON.stringify({
          event: 'command',
          func: func,
          args: args || []
        });
        modeB_iframe.contentWindow.postMessage(msg, '*');
      } catch (err) {
        log('postMessage err: ' + err.message);
      }
    }
  }

  function initModeA() {
    window.onYouTubeIframeAPIReady = function () {
      log('YT API ready, initializing YT.Player with origin: ' + ORIGIN);
      try {
        player = new YT.Player('host', {
          width: '100%',
          height: '100%',
          playerVars: {
            playsinline: 1,
            controls: 0,
            rel: 0,
            fs: 0,
            iv_load_policy: 3,
            disablekb: 1,
            enablejsapi: 1,
            origin: ORIGIN
          },
          events: {
            onReady: function () {
              log('YT.Player onReady');
              send('ready');
              if (pending) {
                player.loadVideoById(pending);
                pending = null;
              }
            },
            onStateChange: function (e) {
              send('state', { s: e.data });
            },
            onError: function (e) {
              send('error', { c: e.data });
            },
            onAutoplayBlocked: function () {
              send('autoplayBlocked');
            }
          }
        });
      } catch (e) {
        log('YT.Player init error: ' + e.message);
        send('error', { c: 'init_failed: ' + e.message });
      }
    };

    var s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    s.onerror = function () {
      log('Failed to load iframe_api');
      send('error', { c: 'script_load_error' });
    };
    document.getElementsByTagName('head')[0].appendChild(s);
  }

  function initModeB() {
    log('Initializing Mode B (direct iframe with postMessage), origin: ' + ORIGIN);
    var host = document.getElementById('host');
    modeB_iframe = document.createElement('iframe');
    modeB_iframe.id = 'yt-iframe';
    modeB_iframe.setAttribute('allow', 'autoplay; encrypted-media');
    modeB_iframe.setAttribute('referrerpolicy', 'strict-origin');

    window.addEventListener('message', function (e) {
      var data = e.data;
      if (typeof data === 'string') {
        try {
          data = JSON.parse(data);
        } catch (err) {
          return;
        }
      }
      if (!data) return;

      if (data.event === 'onReady') {
        log('Mode B onReady received via postMessage');
        send('ready');
        postToIframe('listening', []);
      } else if (data.event === 'onStateChange') {
        var s = (typeof data.info === 'number') ? data.info : parseInt(data.info, 10);
        modeB_state = s;
        send('state', { s: s });
      } else if (data.event === 'onError') {
        send('error', { c: data.info });
      } else if (data.event === 'infoDelivery' && data.info) {
        if (typeof data.info.playerState !== 'undefined') {
          modeB_state = data.info.playerState;
          send('state', { s: modeB_state });
        }
        if (typeof data.info.currentTime !== 'undefined') {
          modeB_currentTime = data.info.currentTime;
        }
        if (typeof data.info.duration !== 'undefined') {
          modeB_duration = data.info.duration;
        }
      }
    }, false);

    modeB_iframe.onload = function () {
      log('Mode B iframe loaded');
      postToIframe('listening', []);
      send('ready');
    };

    host.appendChild(modeB_iframe);
    if (pending) {
      var id = pending;
      pending = null;
      loadModeBVideo(id);
    }
  }

  function loadModeBVideo(id) {
    if (!modeB_iframe) return;
    var embedUrl = 'https://www.youtube.com/embed/' + encodeURIComponent(id) +
                   '?enablejsapi=1&playsinline=1&controls=0&rel=0&fs=0&iv_load_policy=3&autoplay=1&origin=' +
                   encodeURIComponent(ORIGIN);
    log('Mode B setting src: ' + embedUrl);
    modeB_iframe.src = embedUrl;
  }

  window.SL = {
    load: function (id) {
      log('SL.load: ' + id + ' (Mode: ' + MODE + ')');
      if (MODE === 'B') {
        if (modeB_iframe) {
          loadModeBVideo(id);
        } else {
          pending = id;
        }
      } else {
        if (player && player.loadVideoById) {
          player.loadVideoById(id);
        } else {
          pending = id;
        }
      }
    },
    play: function () {
      if (MODE === 'B') {
        postToIframe('playVideo', []);
      } else {
        if (player && player.playVideo) { player.playVideo(); }
      }
    },
    pause: function () {
      if (MODE === 'B') {
        postToIframe('pauseVideo', []);
      } else {
        if (player && player.pauseVideo) { player.pauseVideo(); }
      }
    },
    replay: function () {
      if (MODE === 'B') {
        postToIframe('seekTo', [0, true]);
        postToIframe('playVideo', []);
      } else {
        if (player && player.seekTo) {
          player.seekTo(0, true);
          player.playVideo();
        }
      }
    },
    stop: function () {
      if (MODE === 'B') {
        postToIframe('stopVideo', []);
      } else {
        if (player && player.stopVideo) { player.stopVideo(); }
      }
    },
    snapshot: function () {
      if (MODE === 'B') {
        return JSON.stringify({
          t: modeB_currentTime,
          d: modeB_duration,
          s: modeB_state
        });
      } else {
        if (!player || !player.getCurrentTime) { return '{}'; }
        return JSON.stringify({
          t: player.getCurrentTime(),
          d: player.getDuration(),
          s: player.getPlayerState()
        });
      }
    }
  };

  if (MODE === 'B') {
    initModeB();
  } else {
    initModeA();
  }
})();
</script>
</body>
</html>
