<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=320, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="referrer" content="always">
<meta name="referrer" content="unsafe-url">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    width: 320px;
    height: 200px;
    overflow: hidden;
  }
  #host {
    position: absolute;
    left: 0;
    top: 0;
    width: 320px;
    height: 200px;
    background: #000;
  }
  #yt-iframe, iframe {
    position: absolute;
    left: 0;
    top: 0;
    width: 320px !important;
    height: 200px !important;
    border: 0;
  }
</style>
</head>
<body>
<div id="host"></div>
<script>
(function () {
  function getQueryParam(name) {
    var match = RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
    return match && decodeURIComponent(match[1].replace(/\+/g, ' '));
  }

  var paramOrigin = getQueryParam('origin');
  var ORIGIN = (paramOrigin && paramOrigin.length > 0) ? paramOrigin : '__ORIGIN__';

  var paramMode = getQueryParam('mode');
  var MODE = (paramMode && paramMode.length > 0) ? paramMode : '__MODE__';
  if (MODE !== 'B') {
    MODE = 'A';
  }

  var paramControls = getQueryParam('controls');
  var CONTROLS = (paramControls !== null && typeof paramControls !== 'undefined' && paramControls.length > 0) ? parseInt(paramControls, 10) : 1;

  var paramMute = getQueryParam('mute');
  var MUTE = (paramMute === '1' || paramMute === 'true') ? 1 : 0;

  var player = null;
  var pending = null;
  var modeB_iframe = null;
  var modeB_state = -1;
  var modeB_currentTime = 0;
  var modeB_duration = 0;

  function send(type, data) {
    try {
      var f = document.createElement('iframe');
      f.style.display = 'none';
      f.src = 'sl://' + type + '?d=' + encodeURIComponent(JSON.stringify(data || {}));
      document.body.appendChild(f);
      setTimeout(function () {
        if (f.parentNode) {
          f.parentNode.removeChild(f);
        }
      }, 0);
    } catch (e) {
      // ignore
    }
  }

  function log(msg) {
    send('log', { m: msg });
  }

  window.onerror = function (msg, url, line, col, err) {
    log('WINDOW ERR: ' + msg + ' at ' + (url || '') + ':' + line);
    return false;
  };

  if (window.console) {
    var origLog = window.console.log;
    window.console.log = function () {
      var args = Array.prototype.slice.call(arguments);
      log('[JS log] ' + args.join(' '));
      if (origLog) origLog.apply(window.console, arguments);
    };
    var origErr = window.console.error;
    window.console.error = function () {
      var args = Array.prototype.slice.call(arguments);
      log('[JS err] ' + args.join(' '));
      if (origErr) origErr.apply(window.console, arguments);
    };
  }

  function postToIframe(func, args) {
    if (modeB_iframe && modeB_iframe.contentWindow) {
      try {
        var msg = JSON.stringify({
          event: 'command',
          func: func,
          args: args || []
        });
        modeB_iframe.contentWindow.postMessage(msg, '*');
      } catch (err) {
        log('postMessage err: ' + err.message);
      }
    }
  }

  function initModeA() {
    window.onYouTubeIframeAPIReady = function () {
      var initialVideoId = pending || getQueryParam('videoId') || 'MScWVeKSiHA';
      log('YT API ready, creating YT.Player with initial videoId: ' + initialVideoId + ', controls=' + CONTROLS);
      try {
        player = new YT.Player('host', {
          width: 320,
          height: 200,
          videoId: initialVideoId,
          playerVars: {
            autoplay: 1,
            playsinline: 1,
            controls: CONTROLS,
            mute: MUTE,
            rel: 0,
            fs: 0,
            iv_load_policy: 3,
            disablekb: 1,
            enablejsapi: 1,
            origin: ORIGIN
          },
          events: {
            onReady: function () {
              log('YT.Player onReady fired for video: ' + initialVideoId + ', MUTE=' + MUTE);
              send('ready');
              if (MUTE) {
                try { player.mute(); } catch (err) {}
              }
              try { player.playVideo(); } catch (err) {}
              if (pending && pending !== initialVideoId) {
                log('Loading pending video on ready: ' + pending);
                player.loadVideoById(pending);
                if (MUTE) {
                  try { player.mute(); } catch (err) {}
                }
                try { player.playVideo(); } catch (err) {}
                pending = null;
              }
            },
            onStateChange: function (e) {
              send('state', { s: e.data });
              if (e.data === 3) { // Buffering
                try { player.playVideo(); } catch (err) {}
              }
            },
            onError: function (e) {
              send('error', { c: e.data });
            },
            onAutoplayBlocked: function () {
              send('autoplayBlocked');
            }
          }
        });
      } catch (e) {
        log('YT.Player init error: ' + e.message);
        send('error', { c: 'init_failed: ' + e.message });
      }
    };

    var s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    s.onerror = function () {
      log('Failed to load iframe_api');
      send('error', { c: 'script_load_error' });
    };
    document.getElementsByTagName('head')[0].appendChild(s);
  }

  function initModeB() {
    log('Initializing Mode B (direct iframe), origin: ' + ORIGIN);
    var host = document.getElementById('host');
    modeB_iframe = document.createElement('iframe');
    modeB_iframe.id = 'yt-iframe';
    modeB_iframe.width = '320';
    modeB_iframe.height = '200';
    modeB_iframe.style.width = '320px';
    modeB_iframe.style.height = '200px';
    modeB_iframe.style.border = '0';
    modeB_iframe.setAttribute('allow', 'autoplay; encrypted-media');
    modeB_iframe.setAttribute('referrerpolicy', 'strict-origin');

    window.addEventListener('message', function (e) {
      var data = e.data;
      if (typeof data === 'string') {
        try {
          data = JSON.parse(data);
        } catch (err) {
          return;
        }
      }
      if (!data) return;

      if (data.event === 'onReady') {
        log('Mode B onReady received via postMessage');
        send('ready');
        postToIframe('listening', []);
      } else if (data.event === 'onStateChange') {
        var s = (typeof data.info === 'number') ? data.info : parseInt(data.info, 10);
        modeB_state = s;
        send('state', { s: s });
      } else if (data.event === 'onError') {
        send('error', { c: data.info });
      } else if (data.event === 'infoDelivery' && data.info) {
        if (typeof data.info.playerState !== 'undefined') {
          modeB_state = data.info.playerState;
          send('state', { s: modeB_state });
        }
        if (typeof data.info.currentTime !== 'undefined') {
          modeB_currentTime = data.info.currentTime;
        }
        if (typeof data.info.duration !== 'undefined') {
          modeB_duration = data.info.duration;
        }
      }
    }, false);

    modeB_iframe.onload = function () {
      log('Mode B iframe loaded');
      postToIframe('listening', []);
      send('ready');
    };

    host.appendChild(modeB_iframe);
    var initialId = pending || getQueryParam('videoId') || 'MScWVeKSiHA';
    pending = null;
    loadModeBVideo(initialId);
  }

  function loadModeBVideo(id) {
    if (!modeB_iframe) return;
    var embedUrl = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(id) +
                   '?enablejsapi=1&playsinline=1&controls=' + CONTROLS + '&rel=0&fs=0&iv_load_policy=3&autoplay=1&mute=' + MUTE + '&origin=' +
                   encodeURIComponent(ORIGIN);
    log('Mode B setting src: ' + embedUrl);
    modeB_iframe.src = embedUrl;
  }

  window.SL = {
    load: function (id) {
      log('SL.load: ' + id + ' (Mode: ' + MODE + ', controls: ' + CONTROLS + ', mute: ' + MUTE + ')');
      if (MODE === 'B') {
        if (modeB_iframe) {
          loadModeBVideo(id);
        } else {
          pending = id;
        }
      } else {
        if (player && player.loadVideoById) {
          player.loadVideoById(id);
          if (MUTE) {
            try { player.mute(); } catch (err) {}
          }
          try { player.playVideo(); } catch (err) {}
        } else {
          pending = id;
        }
      }
    },
    play: function () {
      if (MODE === 'B') {
        postToIframe('unMute', []);
        postToIframe('playVideo', []);
      } else {
        if (player) {
          try { player.unMute(); } catch (e) {}
          if (player.playVideo) { player.playVideo(); }
        }
      }
    },
    unmute: function () {
      if (MODE === 'B') {
        postToIframe('unMute', []);
      } else if (player && player.unMute) {
        player.unMute();
      }
    },
    mute: function () {
      if (MODE === 'B') {
        postToIframe('mute', []);
      } else if (player && player.mute) {
        player.mute();
      }
    },
    pause: function () {
      if (MODE === 'B') {
        postToIframe('pauseVideo', []);
      } else {
        if (player && player.pauseVideo) { player.pauseVideo(); }
      }
    },
    replay: function () {
      if (MODE === 'B') {
        postToIframe('seekTo', [0, true]);
        postToIframe('playVideo', []);
      } else {
        if (player && player.seekTo) {
          player.seekTo(0, true);
          player.playVideo();
        }
      }
    },
    stop: function () {
      if (MODE === 'B') {
        postToIframe('stopVideo', []);
      } else {
        if (player && player.stopVideo) { player.stopVideo(); }
      }
    },
    snapshot: function () {
      if (MODE === 'B') {
        return JSON.stringify({
          t: modeB_currentTime,
          d: modeB_duration,
          s: modeB_state
        });
      } else {
        if (!player || !player.getCurrentTime) { return '{}'; }
        return JSON.stringify({
          t: player.getCurrentTime(),
          d: player.getDuration(),
          s: player.getPlayerState()
        });
      }
    },
    inspect: function () {
      var info = {};
      info.mode = MODE;
      info.origin = ORIGIN;
      info.controls = CONTROLS;
      info.win_w = window.innerWidth;
      info.win_h = window.innerHeight;
      var host = document.getElementById('host');
      info.host_w = host ? host.offsetWidth : -1;
      info.host_h = host ? host.offsetHeight : -1;
      info.yt_defined = (typeof window.YT !== 'undefined');
      info.player_defined = (player !== null);
      if (player) {
        if (player.getPlayerState) info.state = player.getPlayerState();
        if (player.getCurrentTime) info.currentTime = player.getCurrentTime();
        if (player.getDuration) info.duration = player.getDuration();
        if (player.getVideoData) info.videoData = player.getVideoData();
      }
      var iframes = document.getElementsByTagName('iframe');
      info.iframe_count = iframes.length;
      if (iframes.length > 0) {
        info.iframe_w = iframes[0].offsetWidth;
        info.iframe_h = iframes[0].offsetHeight;
        info.iframe_src = (iframes[0].src || '').substring(0, 100);
      }
      var videos = document.getElementsByTagName('video');
      info.video_tag_count = videos.length;
      return JSON.stringify(info);
    }
  };

  if (MODE === 'B') {
    initModeB();
  } else {
    initModeA();
  }
})();
</script>
</body>
</html>
